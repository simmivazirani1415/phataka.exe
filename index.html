<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#101A32" />
    <meta name="description" content="Pataka.exe — Har ghar mein ek pataka hai. A miniature Diwali mohalla that builds itself out of tiny blocks." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PATAK! — Har ghar mein ek pataka hai.</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pataka.exe needs JavaScript to build its mohalla.</noscript>
    <script>
      // ?fresh starts the mohalla from scratch: saved progress and photos are cleared first
      (function () {
        var q = new URLSearchParams(location.search);
        if (!q.has('fresh')) return;
        try { localStorage.removeItem('pataka.exe.street.v1'); } catch (e) {}
        try { indexedDB.deleteDatabase('pataka-exe-street'); } catch (e) {}
        q.delete('fresh');
        var s = q.toString();
        history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
